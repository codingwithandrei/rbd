<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slitting - RBD App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating Home Button -->
    <button class="floating-home-button" onclick="navigateTo('index.html')" title="Return to Home">
        🏠 Home
    </button>

    <div class="container">
        <header class="header">
            <h1 class="logo">Slitting</h1>
            <p class="subtitle" id="pageSubtitle">Cut a run off the master roll and label each child roll</p>
        </header>

        <main class="main-content">
            <div class="form-container">
                <div id="pageMessage"></div>

                <!-- Master roll summary (meters left + earlier runs) -->
                <div id="masterSummary" style="display: none; margin-bottom: 28px;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;">
                        <div>
                            <div style="font-size: 0.85rem; color: var(--gray-600);">Master roll</div>
                            <div id="masterIds" style="font-weight: 600;"></div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 0.85rem; color: var(--gray-600);">Meters left</div>
                            <div class="meters-left" id="metersLeft"></div>
                        </div>
                    </div>
                    <div class="meters-bar"><div id="metersBar"></div></div>
                    <div id="runHistory" class="run-history"></div>
                </div>

                <!-- No QR in the URL: scan the master first -->
                <div id="stepScanMaster" class="step" style="display: none;">
                    <h3 class="form-title" style="font-size: 1.4rem; margin-bottom: 12px;">Scan the master roll</h3>
                    <div id="masterScanner" class="scanner-box"></div>
                    <div id="masterScanStatus" class="scanner-status"></div>
                    <div class="manual-code-row">
                        <input type="text" id="manualMaster" class="form-input" placeholder="Or type LOT-STOCK, or an offcut label (B-0013)" onkeydown="if (event.key === 'Enter') submitManualMaster()">
                        <button type="button" class="btn btn-secondary" onclick="submitManualMaster()">Go</button>
                    </div>
                </div>

                <!-- Step 1: job number -->
                <div id="stepJob" class="step" style="display: none;">
                    <h3 class="form-title" style="font-size: 1.4rem; margin-bottom: 16px;">New run</h3>
                    <div class="form-group">
                        <label for="jobNumber" class="form-label">Job Number *</label>
                        <input type="text" id="jobNumber" class="form-input" placeholder="Enter job number">
                    </div>
                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" onclick="navigateTo('index.html')">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="goToRunDetails()">Next</button>
                    </div>
                </div>

                <!-- Step 2: lanes, widths, length -->
                <div id="stepRun" class="step" style="display: none;">
                    <h3 class="form-title" style="font-size: 1.4rem; margin-bottom: 16px;">Run details</h3>

                    <div class="form-group">
                        <label for="laneCount" class="form-label">Number of rolls (lanes) *</label>
                        <input type="number" id="laneCount" class="form-input" min="1" max="20" inputmode="numeric" placeholder="e.g. 5" oninput="buildLanes()">
                    </div>

                    <div id="lanesContainer"></div>
                    <div id="widthTotal" style="font-size: 0.9rem; color: var(--gray-600); margin: -8px 0 20px;"></div>

                    <div class="form-group">
                        <label class="form-label">Length cut (all rolls in this run) *</label>
                        <div class="length-options" id="lengthOptions"></div>
                        <input type="number" id="lengthCustom" class="form-input" min="1" inputmode="numeric" placeholder="Or type meters" oninput="setLength(parseInt(this.value, 10), null)">
                    </div>

                    <div id="runError"></div>

                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" onclick="showStep('stepJob')">Back</button>
                        <button type="button" class="btn btn-primary" onclick="goToLinkLabels()">Next: Label the rolls</button>
                    </div>
                </div>

                <!-- Step 3: scan a blank label for each roll -->
                <div id="stepLink" class="step" style="display: none;">
                    <h3 class="form-title" style="font-size: 1.4rem; margin-bottom: 4px;">Label the rolls</h3>
                    <p id="linkSummary" class="form-subtitle" style="margin-bottom: 16px;"></p>

                    <div id="labelScanner" class="scanner-box"></div>
                    <div id="labelScanStatus" class="scanner-status"></div>

                    <div class="manual-code-row">
                        <input type="text" id="manualCode" class="form-input" placeholder="Or type label number (e.g. B-0001)" onkeydown="if (event.key === 'Enter') submitManualCode()">
                        <button type="button" class="btn btn-secondary" onclick="submitManualCode()">Add</button>
                    </div>

                    <div id="offcutPanel" style="margin-bottom: 16px;"></div>
                    <div id="labelSlots" class="label-slots"></div>
                    <div id="finishError"></div>

                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" onclick="backToRunDetails()">Back</button>
                        <button type="button" id="finishRunBtn" class="btn btn-primary" onclick="finishRun()" disabled>Finish Run</button>
                    </div>
                </div>

                <!-- Step 4: done -->
                <div id="stepDone" class="step" style="display: none;">
                    <div class="success-message">
                        <h3 style="margin-bottom: 12px;">Run Saved</h3>
                        <div id="doneDetails"></div>
                    </div>
                    <div class="button-group" style="margin-top: 30px;">
                        <button type="button" class="btn btn-primary" id="anotherRunBtn" onclick="window.location.reload()">Start Another Run</button>
                        <button type="button" class="btn btn-secondary" onclick="navigateTo('index.html')">Home</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <img src="rbd-logo.png.png" alt="RBD Logo" style="max-width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto;">
            <p>&copy; 2025 RBD Packaging</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="database.js?v=20261031"></script>
    <script src="app.js"></script>
    <script src="scanner.js?v=20261030"></script>
    <script src="job-assignment.js?v=20261031"></script>
</body>
</html>
