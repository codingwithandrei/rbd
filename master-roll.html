<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Roll Registration - RBD App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">Master Roll Registration</h1>
            <p class="subtitle">Mark master roll as received</p>
        </header>

        <main class="main-content">
            <div class="form-container">
                <form id="masterRollForm">
                    <div class="form-group">
                        <label for="stockNumber" class="form-label">Stock Number</label>
                        <input 
                            type="text" 
                            id="stockNumber" 
                            name="stockNumber" 
                            class="form-input" 
                            placeholder="Enter stock number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lotNumber" class="form-label">Lot Number</label>
                        <input 
                            type="text" 
                            id="lotNumber" 
                            name="lotNumber" 
                            class="form-input" 
                            placeholder="Enter lot number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lengthM" class="form-label">Length on the roll label (meters) *</label>
                        <input
                            type="number"
                            id="lengthM"
                            name="lengthM"
                            class="form-input"
                            placeholder="e.g. 6000 (type what's written on the roll)"
                            min="1"
                            max="20000"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">Is this master roll 1300 mm wide? *</label>
                        <div class="length-options" id="widthOptions">
                            <div class="size-option selected" data-width="standard" onclick="chooseMasterWidth(this)">Yes, 1300 mm</div>
                            <div class="size-option" data-width="custom" onclick="chooseMasterWidth(this)">No, other width</div>
                        </div>
                        <input
                            type="number"
                            id="customWidth"
                            class="form-input"
                            placeholder="Enter the width in mm (e.g. 1100)"
                            min="1"
                            max="3000"
                            inputmode="numeric"
                            style="display: none;"
                        >
                    </div>

                    <div id="messageContainer"></div>

                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" onclick="navigateTo('index.html')">Back</button>
                        <button type="submit" class="btn btn-primary">Mark as Received</button>
                    </div>
                </form>
            </div>
        </main>

        <footer class="footer">
            <img src="rbd-logo.png.png" alt="RBD Logo" style="max-width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto;">
            <p>&copy; 2025 RBD Packaging</p>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="database.js?v=20261119"></script>
    <script src="app.js"></script>
    <script src="master-roll.js?v=20261117"></script>
</body>
</html>
